server:
  global:
    external_labels:
      cluster: homelab
  extraArgs:
    web.enable-remote-write-receiver: null
    storage.tsdb.retention.time: 72h
    storage.tsdb.min-block-duration: 2h
    storage.tsdb.max-block-duration: 2h
  retention: null
  persistentVolume:
    enabled: true
    storageClass: local-path-retain
  service:
    type: NodePort
    nodePort: 30091

  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

# Scrape configuration for OpenTelemetry Collector
extraScrapeConfigs: |
  - job_name: 'emqx'
    scrape_interval: 10s
    metrics_path: '/api/v5/prometheus/stats'
    static_configs:
      - targets: ['emqx.observability:18083']
    basic_auth:
      username: 'admin'
      password: 'public'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "emqx_.*|up|scrape_.*"
        action: keep

  - job_name: 'otel-collector'
    scrape_interval: 10s
    static_configs:
      - targets: ['opentelemetry.observability:8888'] # Collector internal metrics
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "otelcol_process_.*|up|scrape_.*"
        action: keep

  - job_name: 'kepler'
    scrape_interval: 30s
    static_configs:
      - targets: ['kepler.observability:28282']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "kepler_(node|container)_cpu_joules_total|up|scrape_.*"
        action: keep

  - job_name: 'hubble'
    scrape_interval: 10s
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: ['kube-system']
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: "hubble-metrics"
      - source_labels: [__address__]
        action: replace
        regex: ([^:]+)(?::\d+)?
        replacement: $1:9965
        target_label: __address__
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "hubble_.*|up|scrape_.*"
        action: keep

# Scrape job configuration for single-node homelab
scrapeConfigs:
  kubernetes-pods:
    job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "cilium_.*|hubble_.*|up|scrape_.*"
        action: keep

  kubernetes-service-endpoints:
    job_name: kubernetes-service-endpoints
    kubernetes_sd_configs:
      - role: endpoints
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: "prometheus-prometheus-node-exporter|prometheus-kube-state-metrics|hubble-metrics"
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "node_cpu_seconds_total|node_load(1|5|15)|node_memory_(MemTotal|MemAvailable|Buffers|Cached)_bytes|node_filesystem_(size|avail|free)_bytes|node_disk_(read|written)_bytes_total|node_disk_io_time_seconds_total|node_network_(receive|transmit)_bytes_total|node_hwmon_temp_celsius|node_boot_time_seconds|node_uname_info|kube_pod_status_phase|kube_pod_container_resource_requests|kube_pod_container_resource_limits|kube_pod_container_status_running|kube_pod_info|kube_deployment_status_replicas|kube_deployment_status_replicas_available|kube_deployment_spec_replicas|kube_node_status_allocatable|kube_node_status_capacity|kube_statefulset_status_replicas_ready|kube_statefulset_replicas|kube_daemonset_status_number_ready|kube_daemonset_status_desired_number_scheduled|kube_namespace_status_phase|kepler_node_.*|cilium_.*|hubble_.*|up|scrape_.*"
        action: keep

  kubernetes-nodes-cadvisor:
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "container_cpu_(usage_seconds_total|cfs_throttled_seconds_total|cfs_periods_total|cfs_throttled_periods_total)|container_memory_(working_set_bytes|rss|cache|usage_bytes)|container_network_(receive|transmit)_bytes_total|container_fs_(usage_bytes|reads_bytes_total|writes_bytes_total)|container_spec_(cpu_quota|cpu_period|memory_limit_bytes)|container_start_time_seconds|kepler_container_.*|up|scrape_.*"
        action: keep

  prometheus:
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "prometheus_tsdb_head_series|prometheus_tsdb_head_samples_appended_total|prometheus_tsdb_storage_blocks_bytes|prometheus_tsdb_wal_storage_size_bytes|prometheus_build_info|traces_.*|up|scrape_.*"
        action: keep

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true

# Disable unnecessary components to save resources
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
